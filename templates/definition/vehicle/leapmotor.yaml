template: leapmotor
products:
  - brand: Leapmotor
requirements:
  description:
    de: |
      Benötigt App-Zertifikate (base64-kodierte PEM-Daten), die aus der offiziellen Leapmotor-App extrahiert wurden.
      Die kodierten Werte für `appCert` und `appKey` werden im evcc Leapmotor-Zertifikatspaket bereitgestellt.
    en: |
      Requires app certificates (base64-encoded PEM data) extracted from the official Leapmotor app.
      The encoded values for `appCert` and `appKey` are provided in the evcc Leapmotor certificate package.
params:
  - preset: vehicle-base
  - name: vin
    example: LFZ...
  - name: appCert
    description:
      de: App-Zertifikat (base64-kodiertes PEM)
      en: App certificate (base64-encoded PEM)
    help:
      de: Base64-kodierter Inhalt der `app_crt.pem`-Datei aus dem Leapmotor-Zertifikatspaket
      en: Base64-encoded content of `app_crt.pem` from the Leapmotor certificate package
    required: true
  - name: appKey
    description:
      de: App-Schlüssel (base64-kodiertes PEM)
      en: App private key (base64-encoded PEM)
    help:
      de: Base64-kodierter Inhalt der `app_key.pem`-Datei aus dem Leapmotor-Zertifikatspaket
      en: Base64-encoded content of `app_key.pem` from the Leapmotor certificate package
    required: true
    mask: true
render: |
  type: leapmotor
  {{ include "vehicle-base" . }}
  appCert: {{ .appCert }}
  appKey: {{ .appKey }}
